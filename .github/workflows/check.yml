name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check skill wiring
        run: node scripts/check-skills.mjs
